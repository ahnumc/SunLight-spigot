name: Java CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR
        run: ./gradlew --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: SunLight
          path: target/SunLight-*.jar
          if-no-files-found: error
          archive: false
